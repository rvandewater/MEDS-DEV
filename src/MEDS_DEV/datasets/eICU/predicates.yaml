predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }

  ED_registration:
    code: { regex: "^ED_REGISTRATION//.*" }
  ED_discharge:
    code: { regex: "^ED_OUT//.*" }

  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }

  # Elevated Creatinine task predicates
  creatinine_1:
    code: LAB//creatinine//mg/dL
  creatinine_2:
    code: LAB//52546//mg/dL
  abnormally_high_creatinine_1:
    code: LAB//creatinine//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null
  abnormally_high_creatinine_2:
    code: LAB//52546//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null
  creatinine:
    expr: or(creatinine_1, creatinine_2)
  abnormally_high_creatinine_mg_dL:
    expr: or(abnormally_high_creatinine_1, abnormally_high_creatinine_2)

  # Hyponatremia task predicates
  sodium:
    code: LAB//sodium//mmol/L
  abnormally_low_sodium:
    code: LAB//sodium//mmol/L
    value_min: null
    value_max: 135 # mEq/L = mmol/L for sodium
    value_max_inclusive: False
  # Metabolic acidosis task predicates
  bicarbonate:
    code: LAB//bicarbonate//mmol/L
  abnormally_low_bicarbonate:
    code: LAB//227443//mEq/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  # Anemia task predicates
  hemoglobin:
    code: LAB//Hgb//g/dL
  # hemoglobin_2:
  #   code: LAB//50811//g/dL
  abnormally_low_hemoglobin:
    code: LAB//Hgb//g/dL
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False
  # abnormally_low_hemoglobin_2:
  #   code: LAB//50811//g/dL
  #   value_min: null
  #   value_max: 13 # g/dL
  #   value_max_inclusive: False
  # hemoglobin:
  #   expr: or(hemoglobin_1, hemoglobin_2)
  # abnormally_low_hemoglobin:
  #   expr: or(abnormally_low_hemoglobin_1, abnormally_low_hemoglobin_2)

  # Leukocytosis task predicates
  wbc:
    code: LAB//WBC x 1000//K/mcL
  abnormally_high_wbc:
    code: LAB//WBC x 1000//K/mcL
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null

  # Thrombocytopenia task predicates
  platelets:
    code: LAB//platelets x 1000//K/mcL
  abnormally_low_platelets:
    code: LAB//platelets x 1000//K/mcL
    value_min: null
    value_max: 150 # K/uL = nL = 10^9/L
    value_max_inclusive: False

  # Hypotension task predicates
  map_1:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
  map_2:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
  abnormally_low_map_1:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)

  potassium:
    code: LAB//potassium//mmol/L
  abnormally_high_potassium:
    code: LAB//potassium//mmol/L
    value_min: 5.0 # mmol/L
    value_min_inclusive: False
    value_max: null

  glucose_1:
    code: LAB//glucose//mg/dL
  glucose_2:
    code: LAB//bedside glucose//mg/dL
  abnormally_low_glucose_1:
    code: "SNOMED/33747003"
    value_min: null
    value_max: 70.2 # mg/dL
    value_max_inclusive: True
  abnormally_low_glucose_2:
    code: LAB//glucose//mg/dL
    value_min: null
    value_max: 70.2 # mg/dL
    value_max_inclusive: True

  glucose:
    expr: or(glucose_1, glucose_2)
  abnormally_low_glucose:
    expr: or(abnormally_low_glucose_1, abnormally_low_glucose_2)
