predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE*" }

  icu_admission:
    code: { regex: "^HOSPITAL_ADMISSION.*" }
  icu_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE.*" }

  # Elevated Creatinine task predicates
  creatinine:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood//umol/l
  abnormally_high_creatinine_umol_L:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood//umol/l
    value_min: 115 # 1.3 mg/dL
    value_min_inclusive: False
    value_max: null
  # Hyponatremia task predicates
  sodium:
    code: OBSERVATION//Sodium [Moles/volume] in Blood//mmol/l
  abnormally_low_sodium:
    code: OBSERVATION//Sodium [Moles/volume] in Blood//mmol/l
    value_min: null
    value_max: 135 # mEq/L = mmol/L for sodium
    value_max_inclusive: False

  # Metabolic Acidosis task predicates
  bicarbonate:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood//mmol/l
  abnormally_low_bicarbonate:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood//mmol/l
    value_min: null
    value_max: 22 # mEq/L = mmol/L for bicarbonate
    value_max_inclusive: False

  # Anemia task predicates. Conversion from g/dL to g/L: multiply by 10
  hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Arterial blood//g/L
  hemoglobin_2:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Blood//g/l
  abnormally_low_hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Blood//g/l
    value_min: null
    value_max: 130 # g/L
    value_max_inclusive: False
  abnormally_low_hemoglobin_2:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Blood//g/l
    value_min: null
    value_max: 130 # g/L
    value_max_inclusive: False
  hemoglobin:
    expr: or(hemoglobin_1, hemoglobin_2)
  abnormally_low_hemoglobin:
    expr: or(abnormally_low_hemoglobin_1, abnormally_low_hemoglobin_2)

  # Leukocytosis task predicates
  wbc:
    code: OBSERVATION//Leukocytes [#/volume] in Blood//G/l
  # wbc_2:
  #   code: OBSERVATION//Band form neutrophils/100 leukocytes in Blood//%
  abnormally_high_wbc:
    code: OBSERVATION//Leukocytes [#/volume] in Blood//G/l
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  # abnormally_high_wbc_2:
  #   code: OBSERVATION//Band form neutrophils/100 leukocytes in Blood//%
  #   value_min: 11 # K/uL
  #   value_min_inclusive: False
  #   value_max: null
  # wbc:
  #   expr: or(wbc_1, wbc_2)
  # abnormally_high_wbc:
  #   expr: or(abnormally_high_wbc_1, abnormally_high_wbc_2)

  # Thrombocytopenia task predicates
  platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood//G/l
  abnormally_low_platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood//G/l
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False

  # Hypotension task predicates
  map_1:
    code: OBSERVATION//Non-invasive mean arterial pressure//mmHg
  map_2:
    code: OBSERVATION//Invasive mean arterial pressure//mmHg
  abnormally_low_map_1:
    code: OBSERVATION//Non-invasive mean arterial pressure//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: OBSERVATION//Invasive mean arterial pressure//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)
