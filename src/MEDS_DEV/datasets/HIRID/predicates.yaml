predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE*" }

  icu_admission:
    code: { regex: "^HOSPITAL_ADMISSION.*" }
  icu_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE.*" }

  creatinine:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood
  abnormally_high_creatinine_umol_l:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood
    value_min: 115 # 1.3 mg/dL
    value_min_inclusive: False
    value_max: null
  # creatinine:
  #   expr: creatinine_1
  # abnormally_high_creatinine:
  #   expr: abnormally_high_creatinine_1

  sodium_1:
    code: OBSERVATION//Sodium [Moles/volume] in Blood
  abnormally_low_sodium_1:
    code: OBSERVATION//Sodium [Moles/volume] in Blood
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False
  sodium:
    expr: sodium_1
  abnormally_low_sodium:
    expr: abnormally_low_sodium_1

  bicarbonate_1:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood
  abnormally_low_bicarbonate_1:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  bicarbonate:
    expr: bicarbonate_1
  abnormally_low_bicarbonate:
    expr: abnormally_low_bicarbonate_1

  hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Arterial blood
  abnormally_low_hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Arterial blood
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False
  hemoglobin:
    expr: hemoglobin_1
  abnormally_low_hemoglobin:
    expr: abnormally_low_hemoglobin_1

  wbc_1:
    code: OBSERVATION//Leukocytes [#/volume] in Blood
  wbc_2:
    code: OBSERVATION//Band form neutrophils/100 leukocytes in Blood
  abnormally_high_wbc_1:
    code: OBSERVATION//Leukocytes [#/volume] in Blood
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  abnormally_high_wbc_2:
    code: OBSERVATION//Band form neutrophils/100 leukocytes in Blood
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  wbc:
    expr: or(wbc_1, wbc_2)
  abnormally_high_wbc:
    expr: or(abnormally_high_wbc_1, abnormally_high_wbc_2)

  platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood
  abnormally_low_platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False
  # platelets:
  #   expr: platelets_1
  # abnormally_low_platelets:
  #   expr: abnormally_low_platelets_1

  map_1:
    code: OBSERVATION//Non-invasive mean arterial pressure
  map_2:
    code: OBSERVATION//Invasive mean arterial pressure
  abnormally_low_map_1:
    code: OBSERVATION//Non-invasive mean arterial pressure
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: OBSERVATION//Invasive mean arterial pressure
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)
